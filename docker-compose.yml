services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: messenger
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d messenger"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    restart: unless-stopped
    environment:
      AUTH_SECRET_KEY: dev-secret-key-change-me-in-production
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/messenger
    ports:
      - "18000:8000"          # хост:контейнер (8000 — порт uvicorn)
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"            # хост:контейнер (80 — порт nginx)
    depends_on:
      - backend

volumes:
  postgres_data:
