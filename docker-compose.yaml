services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: messenger
      POSTGRES_PASSWORD: local-messenger
      POSTGRES_DB: messenger
    ports:
      - "55432:5432" # Пробрасываем на нестандартный порт, как в .env.example
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U messenger -d messenger"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      # Значения по умолчанию из backend/.env.example
      DATABASE_URL: postgresql+psycopg://messenger:local-messenger@db:5432/messenger
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:8080"]'
      APP_ENV: development
      # ВАЖНО: Для production замените на постоянный секрет длиной не менее 32 байт
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-}
      ACCESS_TOKEN_MINUTES: 60
    depends_on:
      db:
        condition: service_healthy
    # Опционально: монтируем код для разработки (hot-reload)
    # volumes:
    #   - ./backend:/app

volumes:
  postgres_data: