x-backend: &backend-common
  image: messenger-backend:local
  build:
    context: ./backend
    dockerfile: Dockerfile
  # Секрет берётся из уже существующего локального файла, не из образа.
  env_file:
    - ./backend/.env
  environment:
    DATABASE_URL: postgresql+psycopg://messenger:local-messenger@db:5432/messenger
    CORS_ORIGINS: '["http://localhost:5173","http://localhost:8080","http://127.0.0.1:8080"]'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: messenger
      POSTGRES_PASSWORD: local-messenger
      POSTGRES_DB: messenger
    ports:
      - 55432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U messenger -d messenger"]
      interval: 5s
      timeout: 5s
      retries: 15

  migrate:
    <<: *backend-common
    command: ["python", "-m", "alembic", "upgrade", "head"]
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    <<: *backend-common
    ports:
      - 18000:8000
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - 16000:80
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
